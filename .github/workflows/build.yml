name: Build FableCraft HTML

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build single-file fablecraft.html
        run: node tools/build-single.mjs

      - name: Upload fablecraft.html artifact
        uses: actions/upload-artifact@v4
        with:
          name: fablecraft.html
          path: dist/fablecraft.html
